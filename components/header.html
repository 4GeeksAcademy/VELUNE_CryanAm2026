<!-- Componente reutilizable: incluir este fragmento dentro del layout de cada vista. -->
<header class="velune-header border-b border-red-900 border-opacity-10" itemscope itemtype="https://schema.org/WPHeader">
  <div class="max-w-7xl mx-auto px-6 py-5 lg:px-10">
    <div class="flex flex-wrap items-center justify-between gap-5">
      <a class="focus-ring flex-shrink-0" href="Home.html" aria-label="VELUNE, página de inicio" itemprop="url">
        <img class="h-12 w-auto" src="VELUNE-imagotipo.svg" alt="VELUNE" itemprop="logo" />
      </a>
      <form class="order-3 w-full lg:order-none lg:w-auto lg:flex-1 lg:max-w-md lg:mx-12" action="catalog.html" method="get" role="search">
        <label class="sr-only" for="site-search">Buscar productos</label>
        <div class="relative">
          <input id="site-search" name="q" class="focus-ring w-full bg-transparent border-b border-current py-2 pr-10 placeholder-current placeholder-opacity-70" type="search" placeholder="Buscar en VELUNE" />
          <button class="focus-ring absolute right-0 top-1/2 transform -translate-y-1/2 p-2" type="submit" aria-label="Enviar búsqueda">⌕</button>
        </div>
      </form>
      <nav class="desktop-nav" aria-label="Navegación principal" itemscope itemtype="https://schema.org/SiteNavigationElement">
        <ul class="flex items-center gap-5 text-sm uppercase tracking-widest">
          <li><a class="focus-ring velune-link" href="cuenta.html" itemprop="url">Cuenta</a></li>
          <li><a class="focus-ring velune-link" href="catalog.html" itemprop="url">Catálogo</a></li>
          <li><a class="focus-ring velune-link" href="carrito.html" itemprop="url">Carrito <span aria-hidden="true">(3)</span><span class="sr-only">3 artículos</span></a></li>
        </ul>
      </nav>
      <details class="mobile-nav">
        <summary class="focus-ring" aria-label="Abrir menú de navegación"><img class="mobile-nav__icon" src="VELUNE-isotipo.svg" alt="Menú VELUNE" /></summary>
        <nav class="mobile-nav__panel" aria-label="Navegación móvil" itemscope itemtype="https://schema.org/SiteNavigationElement">
          <ul class="text-sm uppercase tracking-widest">
            <li><a class="focus-ring velune-link" href="cuenta.html" itemprop="url">Cuenta</a></li>
            <li><a class="focus-ring velune-link" href="catalog.html" itemprop="url">Catálogo</a></li>
            <li><a class="focus-ring velune-link" href="carrito.html" itemprop="url">Carrito <span aria-hidden="true">(3)</span><span class="sr-only">3 artículos</span></a></li>
          </ul>
        </nav>
      </details>
    </div>
  </div>
</header>
